# W5F // Archive Node — kmscon settings (installed as /etc/kmscon/kmscon.conf)
# Terminus at 16 px = 8x16 cells (1280x800 → 160x50). Try 20 for 10x20 cells.
font-name=Terminus
font-size=16
xkb-layout=tr
# hwaccel: off. On the GMA 950 it costs about 86 MB (96.6 MB vs 10.7 MB for kmscon, 2026-09-29).
#hwaccel
# Amber P3, from internal/theme (a Go test keeps these lines in step).
palette=custom
palette-black=18,12,2
palette-red=255,106,0
palette-green=156,107,0
palette-yellow=255,176,0
palette-blue=74,51,0
palette-magenta=255,210,122
palette-cyan=156,107,0
palette-light-grey=255,176,0
palette-dark-grey=74,51,0
palette-light-red=255,106,0
palette-light-green=255,210,122
palette-light-yellow=255,210,122
palette-light-blue=156,107,0
palette-light-magenta=255,210,122
palette-light-cyan=255,210,122
palette-white=255,210,122
palette-foreground=255,176,0
palette-background=18,12,2
